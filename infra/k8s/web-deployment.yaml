apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-web
  labels:
    app: nexus-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-web
  template:
    metadata:
      labels:
        app: nexus-web
    spec:
      containers:
        - name: web
          image: nexus-web:0.1.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-web
spec:
  selector:
    app: nexus-web
  ports:
    - port: 80
      targetPort: 3000

